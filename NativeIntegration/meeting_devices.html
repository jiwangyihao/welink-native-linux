<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meeting devices</title>
  <style>
    :root { color-scheme: light dark; font-family: sans-serif; }
    body { margin: 0; padding: 24px; line-height: 1.45; }
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    p { margin: 10px 0; }
    fieldset { margin: 18px 0; padding: 14px; }
    legend { font-weight: 600; }
    .controls { display: flex; gap: 12px; }
    select { min-width: 0; flex: 1; }
    select, button { font: inherit; padding: 8px; }
    .reason { font-size: 0.9rem; }
    footer { display: flex; gap: 12px; justify-content: flex-end; }
    #status { overflow-wrap: anywhere; }
    :focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>Meeting devices</h1>
  <p>Choose a device and Apply to change it. Nothing is selected or activated automatically. Confirmed changes apply immediately; closing this window does not undo them.</p>
  <p id="connection">Reading the real meeting state…</p>
  <fieldset>
    <legend>Microphone</legend>
    <div class="controls"><select id="audioinput" aria-label="Microphone" aria-describedby="reason-audioinput" disabled></select><button id="apply-audioinput" type="button" disabled>Apply</button></div>
    <p class="reason" id="reason-audioinput"></p>
  </fieldset>
  <fieldset>
    <legend>Audio output</legend>
    <div class="controls"><select id="audiooutput" aria-label="Audio output" aria-describedby="reason-audiooutput" disabled></select><button id="apply-audiooutput" type="button" disabled>Apply</button></div>
    <p class="reason" id="reason-audiooutput"></p>
  </fieldset>
  <fieldset>
    <legend>Camera</legend>
    <div class="controls"><select id="videoinput" aria-label="Camera" aria-describedby="reason-videoinput" disabled></select><button id="apply-videoinput" type="button" disabled>Apply</button></div>
    <p class="reason" id="reason-videoinput"></p>
  </fieldset>
  <p id="status" role="status" aria-live="polite">Loading available devices…</p>
  <footer><button id="refresh" type="button" disabled>Refresh devices</button><button id="close" type="button" autofocus>Done</button></footer>
</body>
</html>
